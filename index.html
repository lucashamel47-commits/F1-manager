<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG + ICO : Safari et les onglets qui ont encore l’ancien logo rouge en cache. SVG pour les écrans nets. ?v=2 casse le cache. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090a" />
    <meta name="description" content="Classements, calendrier, circuits, statistiques et records de la Formule 1." />
    <!-- iOS : app installable sur l'écran d'accueil, plein écran, barre d'état translucide -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="F1 Manager" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>F1 Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
