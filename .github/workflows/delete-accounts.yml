name: Suppression des comptes demandée dans l'app

# Toutes les 15 min : supprime les comptes dont le propriétaire a touché « Supprimer mon compte » (Rappels).
# Gratuit (dépôt public). Utilise le secret SUPABASE_SERVICE_ROLE_KEY déjà en place pour les rappels.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation : affiche ce qui serait supprimé, sans rien supprimer'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delete-accounts
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Configuration absente
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "Comptes en ligne non configurés (VITE_SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY manquant)."
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        with:
          node-version: 22
      - run: node scripts/delete-accounts.mjs
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
