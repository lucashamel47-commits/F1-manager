name: Rappels par email avant les sessions

# Toutes les 15 min : lit le calendrier F1 (Jolpica) et envoie les rappels via Resend aux inscrits (table Supabase).
# Les crons de GitHub peuvent avoir du retard : le script rattrape jusqu'à 90 min et ne crée jamais de doublon.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer aussi un email de test à tous les inscrits actifs'
        type: boolean
        default: false
      dry_run:
        description: 'Simulation : affiche ce qui partirait, sans rien envoyer'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
    steps:
      # Tant que Supabase / Resend ne sont pas configurés, le run reste vert et ne fait rien.
      - name: Configuration absente
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' || env.RESEND_API_KEY == ''
        run: echo "Rappels non configurés (variable VITE_SUPABASE_URL ou secrets SUPABASE_SERVICE_ROLE_KEY / RESEND_API_KEY manquants) — voir SETUP.md."
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.RESEND_API_KEY != ''
      - run: node scripts/send-reminders.mjs
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.RESEND_API_KEY != ''
        env:
          SEND_TEST: ${{ inputs.test && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
